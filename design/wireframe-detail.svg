<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780">
  <rect width="900" height="780" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="900" height="56" fill="#fff" stroke="#e2e8f0"/>
  <rect x="24" y="16" width="140" height="24" rx="4" fill="#cbd5e1"/>
  <text x="30" y="33" font-family="Arial" font-size="12" fill="#64748b">Logo + Tên web</text>
  <rect x="820" y="14" width="56" height="28" rx="14" fill="#e2e8f0"/>
  <text x="832" y="33" font-family="Arial" font-size="11" fill="#64748b">Theme</text>
  
  <!-- Back link -->
  <text x="40" y="90" font-family="Arial" font-size="13" fill="#059669">← Quay lại danh sách</text>
  
  <!-- Title + tags -->
  <text x="40" y="130" font-family="Arial" font-size="26" font-weight="bold" fill="#1e293b">Tên món ăn chi tiết</text>
  <rect x="40" y="145" width="80" height="24" rx="12" fill="#d1fae5"/>
  <text x="52" y="162" font-family="Arial" font-size="11" fill="#065f46">Category</text>
  <rect x="130" y="145" width="60" height="24" rx="12" fill="#fef3c7"/>
  <text x="142" y="162" font-family="Arial" font-size="11" fill="#92400e">Area</text>
  <rect x="200" y="145" width="50" height="24" rx="12" fill="#f1f5f9"/>
  <text x="210" y="162" font-family="Arial" font-size="11" fill="#475569">Tag</text>
  
  <!-- Main image -->
  <rect x="40" y="185" width="820" height="260" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="450" y="320" text-anchor="middle" font-family="Arial" font-size="16" fill="#94a3b8">Hình ảnh món ăn (strMealThumb)</text>
  
  <!-- Two columns -->
  <!-- Left: Ingredients -->
  <rect x="40" y="470" width="260" height="250" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="56" y="500" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">🥕 Nguyên liệu</text>
  <line x1="56" y1="515" x2="280" y2="515" stroke="#e2e8f0"/>
  <text x="56" y="540" font-family="Arial" font-size="12" fill="#475569">• Ingredient 1 ........ measure</text>
  <text x="56" y="562" font-family="Arial" font-size="12" fill="#475569">• Ingredient 2 ........ measure</text>
  <text x="56" y="584" font-family="Arial" font-size="12" fill="#475569">• Ingredient 3 ........ measure</text>
  <text x="56" y="606" font-family="Arial" font-size="12" fill="#475569">• Ingredient 4 ........ measure</text>
  <text x="56" y="628" font-family="Arial" font-size="12" fill="#475569">• Ingredient 5 ........ measure</text>
  <text x="56" y="650" font-family="Arial" font-size="12" fill="#475569">• Ingredient 6 ........ measure</text>
  <text x="56" y="672" font-family="Arial" font-size="12" fill="#94a3b8">...</text>
  
  <!-- Right: Instructions -->
  <rect x="320" y="470" width="540" height="250" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="336" y="500" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">📝 Cách làm</text>
  <line x1="336" y1="515" x2="840" y2="515" stroke="#e2e8f0"/>
  <text x="336" y="545" font-family="Arial" font-size="12" fill="#475569">Bước 1: Mô tả cách chế biến món ăn...</text>
  <text x="336" y="570" font-family="Arial" font-size="12" fill="#475569">Bước 2: Tiếp tục các bước tiếp theo...</text>
  <text x="336" y="595" font-family="Arial" font-size="12" fill="#475569">Bước 3: Hoàn thiện và trang trí món ăn.</text>
  <text x="336" y="620" font-family="Arial" font-size="12" fill="#475569">Bước 4: Thưởng thức khi còn nóng.</text>
  
  <!-- YouTube button -->
  <rect x="336" y="660" width="180" height="36" rx="8" fill="#dc2626"/>
  <text x="360" y="683" font-family="Arial" font-size="13" fill="#fff">▶ Xem video hướng dẫn</text>
  
  <!-- Label -->
  <text x="20" y="760" font-family="Arial" font-size="11" fill="#94a3b8">Wireframe — Trang chi tiết (DetailPage) · MSSV 6651071060</text>
</svg>
